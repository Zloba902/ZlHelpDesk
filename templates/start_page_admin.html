<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk Admin</title>

    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: #131b2e;
            --text-primary: #f8fafc;
            --text-secondary: #b894b8;
            --cyan-accent: #e838f8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. ЛЕВАЯ ПАНЕЛЬ: Навигация, база знаний, архив */
        .left-sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--cyan-accent);
            margin-bottom: 30px;
            padding-left: 10px;
        }

        .nav-group {
            margin-bottom: 25px;
        }

        .nav-group h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-left: 10px;
        }

        .left-sidebar a {
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            display: block;
            margin-bottom: 5px;
            transition: 0.2s;
            font-size: 14px;
        }

        .left-sidebar a:hover {
            background-color: #1e293b;
            color: var(--cyan-accent);
        }

        /* 2. ЦЕНТРАЛЬНАЯ ПАНЕЛЬ: Приветствие и статистика */
        .main-dash {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        /* Таблица-карточка статистики из вашего наброска */
        .stats-table-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            max-width: 700px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: left;
            gap: 15px;
        }

        .stat-item {
            border-right: 1px solid var(--border-color);
            padding-right: 10px;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.3;
            min-height: 34px;
            /* Чтобы выровнять в одну строку */
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--cyan-accent);
        }

        /* 3. ПРАВАЯ ПАНЕЛЬ: Заявки, список ПК и чат */
        .right-sidebar {
            width: 340px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* Вкладки сверху (Заявки / Чат) */
        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: var(--cyan-accent);
            border-bottom: 2px solid var(--cyan-accent);
            background-color: rgba(56, 189, 248, 0.05);
        }

        /* Контент правой панели */
        .right-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .section-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pc-item {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 3px solid var(--cyan-accent);
        }

        .pc-info h5 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .pc-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .badge-msg {
            background-color: #ef4444;
            color: white;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: bold;
        }



        .tab-btn.active {
            color: #d90aec;
            /* Голубой цвет как на скрине */
            border-bottom: 2px solid #ff00ea;
            /* Голубая полоска снизу */
        }

        /* Скрываем все табы по умолчанию */
        .tab-pane {
            display: none;
        }

        /* Показываем только активный таб */
        .tab-pane.active {
            display: flex;
            flex-direction: column;
        }

        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: white;
            padding: 14px 16px;
            background-color: inherit;
            font-family: inherit;
            /* Важно для вертикального выравнивания на мобильных телефонах */
            margin: 0;
            /* Важно для вертикального выравнивания на мобильных телефонах */
        }

       

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content a:hover {
  background-color: #b42727;
}

        .dropdown-content a {
            float: none;
            color: rgb(21, 0, 255);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    <!-- [ЛЕВАЯ ЧАСТЬ]: База знаний, архивы и т.д. -->
    <div class="left-sidebar">

    </div>


    <div class="main-dash">
        <h1 class="welcome-title">Добро пожаловать, {{ name }}</h1>
        <button class="sidebar-btn" onclick="window.location.href='/logout'">Выйти из учетной записи</button>


        <div id="requests-panel" style="margin-top:20px;">
            <div class="section-subtitle" id="requests-title">Выбери пользователя</div>
            <div id="requests-list"></div>
        </div>


    </div>

    <!-- [ПРАВАЯ ЧАСТЬ]: Вкладки "Заявки/Чат" и список активных ПК с ними -->
    <div class="right-sidebar">
        <div class="tabs-header">
            <button class="tab-btn" data-target="tab-request">Заявки</button>
            <button class="tab-btn" data-target="tab-chat">Чат</button>
        </div>

        <div class="tabs-content">

            <div id="tab-request" class="tab-pane active">
                <div class="tab-pane">В сети (есть активные обращения):</div>

                {% for device in devices %}
                <button class="pc-item" data-user-id="{{ device.id }}"
                    onclick="loadRequests('{{ device.id }}', '{{ device.user_name }}')">
                    <h3>ip:{{ device.ip }}</h3>
                    <p>Пользователь:{{ device.user_name }}</p>
                    <p>Кабинет: {{ device.room_num }}</p>
                </button>
                {% endfor %}
            </div>


            <div id="tab-chat" class="tab-pane">
                <p>Здесь будет сам чат...</p>
            </div>
        </div>
    </div>

    <script>
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanes = document.querySelectorAll('.tab-pane');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Убираем класс 'active' у всех кнопок
                tabButtons.forEach(btn => btn.classList.remove('active'));

                // Добавляем класс 'active' текущей нажатой кнопке
                button.classList.add('active');

                // Получаем ID блока, который нужно показать из атрибута data-target
                const targetId = button.getAttribute('data-target');

                // Скрываем все блоки с контентом
                tabPanes.forEach(pane => pane.classList.remove('active'));

                // Показываем нужный блок
                document.getElementById(targetId).classList.add('active');
            });
        });

    </script>
    <script src="/static/js/admin.js"></script>
</body>

</html>
