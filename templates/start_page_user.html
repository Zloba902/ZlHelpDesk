<!DOCTYPE html>
<html lang="ru">


<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-user-page.css') }}">
</head>

<body>
    <div class="left-sidebar">
        <div id="main">
            <h2>Добро пожаловать!</h2>
            <p>Это страница пользователя.</p>
            <button class="sidebar-btn" id="openPanelBtn2"> Ваши заявки </button>
            <button class="sidebar-btn" id="openPanelBtn">Новая заявка</button>
            <form action="/logout" method="POST" style="display: contents;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="sidebar-btn" type="submit">Выйти из учетной записи</button>
            </form>
        </div>
    </div>


    <div class=" main-dash">
        <form class="modal-content" action="/send_request" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="side-panel" id="infoPanel">
                <h3>Информация о заявке (опишите проблему)</h3>
                <div class="form-group">
                    <label for="title">Тема:</label>
                    <input type="text" placeholder="Введите тему..." name="title" required>
                </div>
                <div class="form-group">
                    <label for="request_text">Описание:</label>
                    <textarea rows="5" placeholder="Опишите детали..." name="request_text" required></textarea>
                </div>
                <div class="form-group">
                    <label for="category">Категория:</label>
                    <select name="category" id="category-select">
                        <option value="">Выберите проблему</option>
                        <option value="internet">Проблема с сетью</option>
                        <option value="printer">Проблема с принтером</option>
                        <option value="password">Проблема со входом в сеть</option>
                    </select>
                </div>



                <button class="sidebar-btn" style="margin-top: 10px;" type="submit">Отправить</button>
                <button class="close-btn" id="closePanelBtn" type="button">✖ Закрыть</button>
            </div>
        </form>

        <div id="solution-box">

        </div>


        <div class="side-panel" id="Panelrequests">
            <h3>Ваши заявки</h3>
            <!-- Карточки заявок рисует user.js (loadUserRequests) -->
            <div id="user-requests-list" data-user-id="{{ user_id }}"></div>
            <button class="close-btn" id="closePanelBtn2">✖ Закрыть</button>
        </div>
    </div>



    <div class="right-sidebar">
        <div id="tab-chat">



        </div>
    </div>



    <script src="/static/js/user.js"></script>

    <script src="/static/js/admin.js"></script>



</body>

</html>
